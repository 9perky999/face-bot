<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Rate AI</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background-color: #0d0d0d; color: #00ff00; font-family: 'Courier New', monospace; text-align: center; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; }
        .scanner { width: 200px; height: 200px; border: 2px solid #00ff00; border-radius: 50%; position: relative; overflow: hidden; margin-bottom: 20px; box-shadow: 0 0 20px #00ff00; }
        .scanner::after { content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: #00ff00; box-shadow: 0 0 10px #00ff00; animation: scan 1.5s linear infinite; }
        @keyframes scan { 0% { top: 0; } 100% { top: 100%; } }
        input[type="file"] { display: none; }
        .btn { background-color: #00ff00; color: black; padding: 15px 30px; border: none; border-radius: 5px; font-size: 18px; font-weight: bold; cursor: pointer; margin-top: 20px; }
        .btn:active { background-color: #00cc00; }
        #status { margin-top: 20px; font-size: 14px; }
    </style>
</head>
<body>
    <div class="scanner"></div>
    <h2 id="status">Нейросеть готова к сканированию</h2>
    
    <input type="file" id="photoInput" accept="image/*" onchange="uploadPhoto()">
    <button class="btn" onclick="document.getElementById('photoInput').click()">ЗАГРУЗИТЬ СЕЛФИ</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        function uploadPhoto() {
            const file = document.getElementById('photoInput').files[0];
            if (!file) return;

            document.getElementById('status').innerText = "АНАЛИЗ ЛИЦА...";
            document.querySelector('.scanner').style.borderColor = "#ff0000";

            const formData = new FormData();
            formData.append('photo', file);
            formData.append('user_id', tg.initDataUnsafe.user.id);

            fetch('/upload', {
                method: 'POST',
                body: formData
            }).then(response => response.text()).then(data => {
                document.getElementById('status').innerText = "РЕЗУЛЬТАТ: " + data;
                document.querySelector('.scanner').style.borderColor = "#00ff00";
            }).catch(err => {
                document.getElementById('status').innerText = "ОШИБКА СВЯЗИ";
            });
        }
    </script>
</body>
</html>
